name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Every job declares only the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag (version and branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout with history to inspect main
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      move_stable: ${{ steps.newest.outputs.stable }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches config.json bot.version
        run: |
          python3 - <<'EOF'
          import json, os, sys

          tag = os.environ["GITHUB_REF_NAME"]
          with open("config.json", encoding="utf-8") as file:
              version = json.load(file)["bot"]["version"]

          if tag != f"v{version}":
              print(
                  f"::error::Tag {tag} does not match config.json bot.version ({version}). "
                  f"Bump bot.version to {tag.removeprefix('v')} in a PR to dev, merge dev into main, "
                  "then tag that main commit (see docs/development.md, Releases)."
              )
              sys.exit(1)
          print(f"Tag {tag} matches config.json bot.version")
          EOF

      - name: Check tagged commit is a commit of main itself
        run: |
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          # Only main's own history counts (its merge commits and direct
          # commits), not the dev commits it merged: those are ancestors of
          # main too, but their image was built from dev. The release image
          # must be the one the main publish built.
          if ! git rev-list --first-parent origin/main | grep -qx "$commit"; then
            echo "::error::Tag $GITHUB_REF_NAME points to $commit, which is not a commit of main itself (probably a dev commit merged into main). Tag the main merge commit instead: git switch main, git pull, git tag -a $GITHUB_REF_NAME -m \"$GITHUB_REF_NAME\", git push origin $GITHUB_REF_NAME (see docs/development.md, Releases)."
            exit 1
          fi

      - name: Check whether this is the newest version
        id: newest
        run: |
          # stable follows the newest release only, so cutting a fix for an
          # older line (for example v0.1.3 after v0.2.0) never moves it back.
          newest="$(git tag --list 'v*.*.*' | sort -V | tail -n 1)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$GITHUB_REF_NAME is not the newest version ($newest); stable will stay where it is."
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse "$GITHUB_SHA^{commit}")" >> "$GITHUB_OUTPUT"

  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read # checkout only

  image:
    # Adds the version tag to the image already published for the tagged main
    # commit (docker-publish.yml) and, for the newest version, moves stable to
    # it. Never builds: if that image is missing, the release fails instead of
    # publishing a different build.
    name: Tag release image in GHCR
    needs: [verify-tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # add a tag to ghcr.io with GITHUB_TOKEN
    env:
      # GHCR paths must be lowercase.
      IMAGE_NAME: ghcr.io/indimops/miyabi-bot
      COMMIT: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Find the image of the tagged commit
        id: source
        run: |
          source_image="$IMAGE_NAME:sha-${COMMIT::12}"
          # The main publish for this commit may still be running when the tag
          # is pushed right after the merge, so wait for it for a while.
          deadline=$((SECONDS + 20 * 60))
          while :; do
            set +e
            digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}' 2>&1)"
            code=$?
            set -e
            [ "$code" -eq 0 ] && break
            if ! grep -qi 'not found' <<<"$digest"; then
              echo "::error::Could not read $source_image: $digest"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$source_image does not exist. The release image is never rebuilt: make sure the 'CI and Docker publish' run for $COMMIT on main succeeded, then re-run this workflow."
              exit 1
            fi
            echo "$source_image not found yet; waiting for the main publish..."
            sleep 30
          done
          echo "$source_image: $digest"
          echo "image=$source_image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Add version tag (never move an existing one)
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          target="$IMAGE_NAME:$GITHUB_REF_NAME"
          set +e
          existing="$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}' 2>&1)"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            if [ "$existing" = "$DIGEST" ]; then
              echo "::notice::$target already points to $DIGEST."
              exit 0
            fi
            echo "::error::$target already exists and points to $existing, not $DIGEST. Version tags are immutable."
            exit 1
          elif ! grep -qi 'not found' <<<"$existing"; then
            echo "::error::Could not check whether $target exists: $existing"
            exit 1
          fi
          # Same manifest by digest: no rebuild and no layer upload.
          # --prefer-index=false keeps the manifest, so the digest is unchanged.
          docker buildx imagetools create --prefer-index=false --tag "$target" "$IMAGE_NAME@$DIGEST"

      - name: Move stable to the release image
        if: needs.verify-tag.outputs.move_stable == 'true'
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          # stable is the newest official release; it is moved only here,
          # never by a branch publish.
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:stable" "$IMAGE_NAME@$DIGEST"

      - name: Verify release tags point to the source image
        env:
          SOURCE_IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.source.outputs.digest }}
          MOVE_STABLE: ${{ needs.verify-tag.outputs.move_stable }}
        run: |
          tags=("$SOURCE_IMAGE" "$IMAGE_NAME:$GITHUB_REF_NAME")
          if [ "$MOVE_STABLE" = true ]; then
            tags+=("$IMAGE_NAME:stable")
          fi
          for tag in "${tags[@]}"; do
            remote_digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            echo "$tag: $remote_digest"
            [ "$remote_digest" = "$DIGEST" ] || { echo "::error::$tag points to $remote_digest, not $DIGEST"; exit 1; }
          done

      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io || true

  draft-release:
    name: Create draft GitHub Release
    needs: [verify-tag, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft release
    steps:
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run for an existing release (for example after the tag was
          # re-pointed) keeps the release and its edited notes as they are.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::A release for $GITHUB_REF_NAME already exists; not creating another one."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
