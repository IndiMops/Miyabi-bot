name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Every job declares only the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag (version and branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout with history to inspect main
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches config.json bot.version
        run: |
          python3 - <<'EOF'
          import json, os, sys

          tag = os.environ["GITHUB_REF_NAME"]
          with open("config.json", encoding="utf-8") as file:
              version = json.load(file)["bot"]["version"]

          if tag != f"v{version}":
              print(
                  f"::error::Tag {tag} does not match config.json bot.version ({version}). "
                  f"Bump bot.version to {tag.removeprefix('v')} in a PR to dev, merge dev into main, "
                  "then tag that main commit (see docs/development.md, Releases)."
              )
              sys.exit(1)
          print(f"Tag {tag} matches config.json bot.version")
          EOF

      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main. Releases are cut from main only."
            exit 1
          fi

  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read # checkout only

  draft-release:
    name: Create draft GitHub Release
    needs: [verify-tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft release
    steps:
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
