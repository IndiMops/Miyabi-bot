name: CI

on:
  push:
    # Every working branch. Tag pushes are not matched here; release.yml
    # runs the same checks for v*.*.* tags through workflow_call.
    branches: ["**"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per PR, so a newer commit cancels the run for
  # the outdated one. Every other run (push, manual, release call) gets its own
  # group from its run ID: it is never cancelled or queued behind another run.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dependencies:
    name: Dependencies (install, consistency, lock files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock

      - name: Check installed packages are compatible
        run: python -m pip check

      - name: Check lock files match requirements files
        run: |
          # uv keeps the versions already pinned in the output file, so this
          # only changes the locks when requirements*.txt no longer match them.
          python -m uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes -o requirements.lock --quiet
          python -m uv pip compile requirements-dev.txt --constraint requirements.lock --universal --python-version 3.11 --generate-hashes -o requirements-dev.lock --quiet
          if ! git diff --exit-code -- requirements.lock requirements-dev.lock; then
            echo "::error::Lock files are out of date. Regenerate them as described in docs/development.md (Dependencies) and commit the result."
            exit 1
          fi

  lint:
    name: Lint (syntax + Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dev tools (hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check Python syntax (compileall)
        run: python -m compileall -q bot.py cogs embeds utils views status_service

      - name: Run critical Ruff checks
        run: python -m ruff check --select E9,F63,F7,F82 --output-format=github .

  test:
    name: Tests (pytest, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock

      # No .env and no secrets: the tests must not need a Discord token or network.
      - name: Run tests
        run: python -m pytest -ra

  docker:
    # Independent of the other jobs, so the image is verified even while a
    # test fails. A release still needs every job in this workflow to pass.
    name: Docker image (build + smoke test + compose, not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway compose project and image tag that exist only on this runner.
      COMPOSE_PROJECT_NAME: miyabi-ci
      MIYABI_IMAGE: miyabi-bot:compose-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          version="ci-${GITHUB_SHA::7}"
          echo "BOT_VERSION=$version" >> "$GITHUB_ENV"
          docker build \
            --build-arg BOT_VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag miyabi-bot:ci .

      - name: Smoke test image
        run: bash scripts/docker-smoke-test.sh miyabi-bot:ci "$BOT_VERSION"

      - name: Create throwaway .env (dummy status secret only)
        run: |
          # Generated for this run; no real token or webhook is involved.
          umask 077
          printf 'STATUS_HEARTBEAT_SECRET=%s\n' "$(openssl rand -hex 24)" > .env

      - name: Validate and build with compose
        run: |
          docker compose config --quiet
          docker compose build

      - name: Start status service and wait for its healthcheck
        run: |
          # --wait returns only when the service's healthcheck reports healthy
          # and fails if it turns unhealthy or the timeout expires. The bot is
          # not started: it would need a real Discord token.
          docker compose up --detach --wait --wait-timeout 120 status
          health="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps --quiet status)")"
          echo "status service health: $health"
          test "$health" = healthy

      - name: Show status service logs
        if: always()
        run: docker compose logs --no-color status || true

      - name: Remove compose test resources
        if: always()
        run: |
          # Runner-local project "miyabi-ci" only; never run `down --volumes`
          # against the production project.
          touch .env
          docker compose down --volumes --remove-orphans
